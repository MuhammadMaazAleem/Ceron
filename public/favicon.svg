<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Pearl luster radial gradient -->
    <radialGradient id="pearlLuster" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FDFBF7" />
      <stop offset="55%" stop-color="#F5F3FF" />
      <stop offset="80%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </radialGradient>
    <!-- Iridescent rim shimmer -->
    <linearGradient id="iridescentRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#60A5FA" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.6" />
    </linearGradient>
    <!-- Oyster shell base gradient -->
    <linearGradient id="shellGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient glow backdrop -->
  <circle cx="50" cy="50" r="46" fill="#F8FAFC" />

  <!-- Oyster shell lower valve cradle -->
  <path d="M 18 64 C 22 84, 78 84, 82 64 C 74 74, 26 74, 18 64 Z" fill="url(#shellGradient)" opacity="0.85" />
  
  <!-- Subtle inner mother-of-pearl bed -->
  <path d="M 22 62 C 28 76, 72 76, 78 62 C 70 70, 30 70, 22 62 Z" fill="#F1F5F9" opacity="0.9" />

  <!-- Glowing Luminous Pearl -->
  <circle cx="50" cy="46" r="28" fill="url(#pearlLuster)" filter="url(#softGlow)" stroke="url(#iridescentRim)" stroke-width="1.5" />
  
  <!-- High-luster specular reflection dot -->
  <ellipse cx="42" cy="36" rx="6" ry="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-20 42 36)" />
  <circle cx="48" cy="33" r="2" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Gentle sparkle accent -->
  <path d="M 68 24 Q 72 24 72 20 Q 72 24 76 24 Q 72 24 72 28 Q 72 24 68 24 Z" fill="#F59E0B" opacity="0.9" />
</svg>