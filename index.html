    rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    // In local development, purge any stale service workers or caches so React versions never clash
    if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.port === '5173')) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
      if (window.caches) {
        caches.keys().then(function(keys) {
          for (var j = 0; j < keys.length; j++) {
            caches.delete(keys[j]);
          }
        });
      }
    }
  </script>
